<!-- @dsCard group="Layout" height=320 width=1120 subtitle="S03 정기배송 3단계 흐름도" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>StepFlow</title>
<style>
body{margin:0;background:var(--surface-tint);font-family:var(--font-sans);color:var(--ink)}
ol{list-style:none;margin:0;padding:var(--space-8) var(--space-6);display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:var(--space-6);align-items:center}
li.s{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.disc{position:relative;width:168px;height:168px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.num{position:absolute;top:4px;left:4px;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--white);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center}
h3{margin:0 0 6px;font-size:22px;font-weight:700} p{margin:0;font-size:16px;color:var(--ink-muted)}
.arr{padding-bottom:72px;color:var(--arrow)}
</style></head>
<body>
<ol>
  <li class="s"><div class="disc" style="background:var(--pastel-mint)"><span class="num">1</span>
    <svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true" style="fill:var(--ink)"><ellipse cx="32" cy="42" rx="14" ry="11"/><circle cx="16" cy="28" r="6"/><circle cx="25" cy="18" r="6"/><circle cx="39" cy="18" r="6"/><circle cx="48" cy="28" r="6"/></svg></div>
    <div><h3>간식 고르기</h3><p>6가지 수제간식 중 원하는 맛을 골라요</p></div></li>
  <li class="arr" aria-hidden="true"><svg viewBox="0 0 48 24" width="48" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h42M36 4l8 8-8 8"/></svg></li>
  <li class="s"><div class="disc" style="background:var(--pastel-butter)"><span class="num">2</span>
    <svg viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 22 L18 10 L25 19"/><path d="M39 19 L46 10 L50 22"/><rect x="8" y="20" width="48" height="36" rx="10"/><path d="M32 30v16M24 38h16"/></svg></div>
    <div><h3>수량 담고 신청</h3><p>개수를 담고 바로 정기배송 신청</p></div></li>
  <li class="arr" aria-hidden="true"><svg viewBox="0 0 48 24" width="48" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h42M36 4l8 8-8 8"/></svg></li>
  <li class="s"><div class="disc" style="background:var(--pastel-peach)"><span class="num">3</span>
    <svg viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="12" width="48" height="44" rx="8"/><path d="M8 24h48M20 6v10M44 6v10"/><path d="M24 40l6 6 12-12"/></svg></div>
    <div><h3>매달 1회 받아보기</h3><p>한 달에 한 번, 박스가 도착해요</p></div></li>
</ol>
</body>
</html>
